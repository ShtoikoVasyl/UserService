spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration-test
jwt:
  rest:
    key: 
    expiration_time:
      access: 360000
      refresh: 86400000
      cross_service: 150000
logging:
  level:
    org.flywaydb: DEBUG
